# 福彩推荐系统 — Docker Compose
# 使用方法:
#   1. 复制 .env.example 为 .env 并填写实际值: cp .env.example .env
#   2. docker-compose up -d
#   3. 浏览器访问 http://localhost:8000
#   （容器内监听 8080，映射到宿主机 8000）

version: "3.8"

services:
  lottery-web:
    build:
      context: .
    image: lottery-web:latest
    container_name: lottery-web
    ports:
      - "8000:8080"
    volumes:
      # 数据持久化 — 数据保存在项目目录的 data/ 下
      - ./data:/app/data
      - ./model:/app/model
    environment:
      # 必须通过 .env 文件注入，请复制 .env.example 为 .env 并填写实际值
      - LOTTERY_USER=${LOTTERY_USER:-admin}
      - LOTTERY_PASS=${LOTTERY_PASS:?LOTTERY_PASS must be set in .env}
      - DEBUG=${DEBUG:-true}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:8000,http://127.0.0.1:8000}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s