[project]
name = "welfare-predict"
version = "2.4.0"
description = "福彩推荐系统 — 面向彩票店老板的号码推荐工具"
requires-python = ">=3.13,<3.14"
dependencies = [
    "requests>=2.32.3",
    "beautifulsoup4>=4.12.3",
    "pandas>=2.2.3",
    "numpy>=2.1",
    "lxml>=5.2",
    "loguru>=0.7.2",
    "scikit-learn>=1.6",
    "xgboost>=2.1",
    "joblib>=1.3.0",
    "tqdm>=4.66.4",
    "pyyaml>=6.0.1",
    "python-dotenv>=1.0.1",
    "fastapi[standard]>=0.111.0",
    "uvicorn>=0.29.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.2",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
]

[tool.fastapi]
entryPoint = "src.api:app"